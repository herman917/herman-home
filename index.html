  <style>
    /* ==========================================================================
       1. 主題變數與色彩系統（深色科技風為主，支援淺色模式切換）
       ========================================================================== */
    :root {
      --bg-base: #070b14;
      --bg-gradient-1: rgba(56, 189, 248, 0.16);
      --bg-gradient-2: rgba(129, 140, 248, 0.14);
      --bg-gradient-3: rgba(16, 185, 129, 0.1);
      --surface-glass: rgba(15, 23, 42, 0.62);
      --surface-glass-hover: rgba(22, 33, 58, 0.78);
      --surface-nav: rgba(7, 11, 20, 0.75);
      --border-glass: rgba(148, 163, 184, 0.18);
      --border-glow: rgba(56, 189, 248, 0.55);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --shadow-card: 0 12px 36px -12px rgba(2, 6, 23, 0.75);
      --shadow-glow: 0 0 28px rgba(56, 189, 248, 0.24);
      --avatar-ring: conic-gradient(from 120deg, #38bdf8, #818cf8, #34d399, #38bdf8);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 999px;
      --transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    html[data-theme='light'] {
      --bg-base: #f1f5f9;
      --bg-gradient-1: rgba(14, 165, 233, 0.16);
      --bg-gradient-2: rgba(99, 102, 241, 0.12);
      --bg-gradient-3: rgba(16, 185, 129, 0.1);
      --surface-glass: rgba(255, 255, 255, 0.72);
      --surface-glass-hover: rgba(255, 255, 255, 0.92);
      --surface-nav: rgba(241, 245, 249, 0.78);
      --border-glass: rgba(15, 23, 42, 0.1);
      --border-glow: rgba(2, 132, 199, 0.48);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-2: #4f46e5;
      --accent-soft: rgba(2, 132, 199, 0.1);
      --shadow-card: 0 12px 32px -12px rgba(15, 23, 42, 0.14);
      --shadow-glow: 0 0 24px rgba(2, 132, 199, 0.18);
      color-scheme: light;
    }

    /* ==========================================================================
       2. 基礎重置與背景氛圍
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC',
        'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color var(--transition), color var(--transition);
    }

    /* 背景光暈與細微科技網格 */
    .bg-backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 18%, var(--bg-gradient-1), transparent 42%),
        radial-gradient(circle at 85% 22%, var(--bg-gradient-2), transparent 40%),
        radial-gradient(circle at 50% 85%, var(--bg-gradient-3), transparent 45%);
    }

    .bg-backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--border-glass) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-glass) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.25;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
    }

    .container {
      width: min(1120px, 92vw);
      margin-inline: auto;
    }

    /* ==========================================================================
       3. 頂部導覽列（Glassmorphism Sticky Navbar）
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--surface-nav);
      border-bottom: 1px solid var(--border-glass);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 1.05rem;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-links a {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      transition: color var(--transition), background-color var(--transition);
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text-primary);
      background: var(--accent-soft);
      outline: none;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      background: var(--surface-glass);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }

    .theme-toggle:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
      transform: translateY(-1px);
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border-glass);
      background: var(--surface-glass);
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition), color var(--transition);
    }

    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       4. Hero / 關於我區塊
       ========================================================================== */
    .hero {
      padding: 64px 0 40px;
    }

    .hero-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 36px;
      padding: 40px;
      border-radius: var(--radius-lg);
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow-card);
    }

    /* 頭像微光環 */
    .avatar-wrap {
      position: relative;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      padding: 4px;
      background: var(--avatar-ring);
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.28), 0 12px 24px rgba(2, 6, 23, 0.45);
      flex-shrink: 0;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--bg-base);
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback {
      width: 64%;
      height: 64%;
      color: var(--accent);
      opacity: 0.88;
    }

    .hero-content h1 {
      font-size: clamp(1.75rem, 3.4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-name-en {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-tagline {
      display: inline-block;
      padding: 6px 14px;
      margin-bottom: 16px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .hero-bio {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 64ch;
      margin-bottom: 12px;
    }

    .hero-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 20px;
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .hero-mail {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-primary);
      text-decoration: none;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      transition: border-color var(--transition), color var(--transition), box-shadow var(--transition);
    }

    .hero-mail:hover {
      color: var(--accent);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }

    .visit-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-primary,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      box-shadow: 0 8px 20px -6px rgba(56, 189, 248, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -6px rgba(56, 189, 248, 0.65);
    }

    .btn-ghost {
      background: var(--surface-glass);
      color: var(--text-primary);
      border: 1px solid var(--border-glass);
    }

    .btn-ghost:hover {
      transform: translateY(-2px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }

    /* ==========================================================================
       5. 區塊共用標題樣式
       ========================================================================== */
    section.section {
      padding: 44px 0;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .section-eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .section-title {
      font-size: clamp(1.4rem, 2.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .section-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       6. 照片走廊（Photo Gallery）
       ========================================================================== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 185px));
      justify-content: center;
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      aspect-ratio: 4 / 3;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .gallery-item:hover,
    .gallery-item:focus-visible {
      transform: translateY(-4px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      outline: none;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .gallery-caption {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 18px 10px 8px;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.85), transparent);
      color: #f8fafc;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .gallery-zoom-hint {
      font-size: 0.7rem;
      font-weight: 500;
      color: #cbd5e1;
      opacity: 0.85;
    }

    .gallery-empty,
    .gallery-error {
      grid-column: 1 / -1;
      padding: 36px 20px;
      text-align: center;
      border-radius: var(--radius-md);
      background: var(--surface-glass);
      border: 1px dashed var(--border-glass);
      color: var(--text-secondary);
    }

    /* ==========================================================================
       7. 精選作品集（Portfolio）
       ========================================================================== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      background: var(--surface-glass);
      color: var(--text-secondary);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-glow);
    }

    .filter-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--border-glow);
      font-weight: 600;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow-card);
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition), border-color var(--transition),
        box-shadow var(--transition), background-color var(--transition);
    }

    .project-card:hover,
    .project-card:focus-visible {
      transform: translateY(-4px);
      background: var(--surface-glass-hover);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      outline: none;
    }

    .project-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .project-head-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .project-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      flex-shrink: 0;
    }

    .project-icon svg {
      width: 18px;
      height: 18px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pill {
      padding: 2px 9px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .project-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .project-arrow {
      display: inline-flex;
      align-items: center;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: transform var(--transition);
    }

    .project-card:hover .project-arrow {
      transform: translate(3px, -2px);
    }

    .project-card-cover {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
    }

    .project-actions {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .project-shortcut-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: var(--surface-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition), background-color var(--transition), transform var(--transition);
    }

    .project-shortcut-btn:hover {
      color: var(--accent);
      border-color: var(--border-glow);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .project-shortcut-btn svg {
      width: 15px;
      height: 15px;
    }

    /* ==========================================================================
       7.5 訪客留言板（Guestbook）
       ========================================================================== */
    .guestbook-layout {
      max-width: 680px;
    }

    .guestbook-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-view-gb {
      align-self: flex-start;
      padding: 7px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .guestbook-list-panel.hidden {
      display: none;
    }

    .pwd-modal {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pwd-modal.hidden {
      display: none;
    }

    .pwd-card {
      width: min(340px, 92vw);
      padding: 24px;
      border-radius: var(--radius-md);
      background: var(--surface-glass-hover);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pwd-card h3 {
      font-size: 1.08rem;
      margin: 0;
    }

    .pwd-card input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-glass);
      background: rgba(15, 23, 42, 0.45);
      color: var(--text-primary);
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      text-align: center;
    }

    html[data-theme='light'] .pwd-card input {
      background: rgba(255, 255, 255, 0.9);
    }

    .pwd-error {
      min-height: 1.1em;
      font-size: 0.82rem;
      color: #f87171;
    }

    .pwd-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .shortcut-card {

      font-weight: 600;

      gap: 6px;

      color: #34d399;
    }

      display: none !important;

      box-shadow: var(--shadow-card);
    }

    .guestbook-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-secondary);

      .guestbook-layout {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       8. 燈箱預覽（Lightbox）
       ========================================================================== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      padding: 20px;
      touch-action: pan-y;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-stage {
      position: relative;
      max-width: min(92vw, 1080px);
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .lightbox-stage img {
      max-width: 100%;
      max-height: calc(84vh - 48px);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      object-fit: contain;
      user-select: none;
    }

    .lightbox-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    .lightbox-counter {
      padding: 2px 10px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.82rem;
    }

    .lightbox-btn {
      position: fixed;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.72);
      color: #f8fafc;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .lightbox-btn:hover {
      background: rgba(56, 189, 248, 0.35);
      transform: scale(1.06);
    }

    .lightbox-close {
      top: 18px;
      right: 18px;
    }

    .lightbox-prev {
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-prev:hover,
    .lightbox-next:hover {
      transform: translateY(-50%) scale(1.06);
    }

    /* ==========================================================================
       9. 頁尾
       ========================================================================== */
    footer {
      padding: 36px 0 48px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      border-top: 1px solid var(--border-glass);
      margin-top: 32px;
    }

    /* ==========================================================================
       10. RWD 響應式斷點（平板 / 手機直向與橫向）
       ========================================================================== */
    @media (max-width: 768px) {
      .hero {
        padding: 36px 0 24px;
      }

      .hero-card {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 28px 22px;
        gap: 22px;
      }

      .avatar-wrap {
        margin-inline: auto;
        width: 132px;
        height: 132px;
      }

      .hero-meta-row,
      .hero-cta {
        justify-content: center;
      }

      .nav-links a {
        padding: 6px 10px;
        font-size: 0.88rem;
      }

      .theme-label {
        display: none;
      }

      .lightbox-prev {
        left: 10px;
      }

      .lightbox-next {
        right: 10px;
      }
    }

    @media (max-width: 480px) {
      .nav-inner {
        height: auto;
        min-height: 58px;
        padding-block: 8px;
        flex-wrap: wrap;
      }

      .nav-links {

        padding-top: 6px;
      }

      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));

      }
    }

    /* 手機橫向高度較低時，確保燈箱按鈕不遮擋圖片 */
    @media (max-height: 500px) and (orientation: landscape) {
      .hero {
        padding: 24px 0;
      }

      .lightbox-stage img {
        max-height: 76vh;
      }
    }
  </style>
</head>

      trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
      puzzle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>',
      physics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><circle cx="18" cy="12" r="2.5"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>',
      arcade: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 19 21 12 17 5 21 12 2"/></svg>',
    }

    // =========================================================================
    // 1. 大頭貼載入失敗替代圖示
    // =========================================================================
    const avatarImg = document.getElementById('avatarImg')
    const avatarContainer = document.getElementById('avatarContainer')

    avatarImg.addEventListener('error', () => {
      avatarContainer.innerHTML = `
        <svg class="avatar-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="預設頭像圖示">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      `
    })

    // =========================================================================
    // 2. 深色 / 淺色模式切換（持久化至 localStorage）
    // =========================================================================
    const rootEl = document.documentElement
    const themeToggleBtn = document.getElementById('themeToggle')
    const themeIcon = document.getElementById('themeIcon')
    const themeLabel = document.getElementById('themeLabel')

    const sunIcon = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'

    function applyTheme(theme) {
      rootEl.setAttribute('data-theme', theme)
      localStorage.setItem('herman-theme', theme)
      const isDark = theme === 'dark'
      themeIcon.innerHTML = isDark ? sunIcon : moonIcon
      themeLabel.textContent = isDark ? '淺色模式' : '深色模式'
    }

    const savedTheme = localStorage.getItem('herman-theme')
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    applyTheme(savedTheme || (prefersDark ? 'dark' : 'dark'))

    themeToggleBtn.addEventListener('click', () => {
      const next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
      applyTheme(next)
    })

    // =========================================================================
    // 3. 照片走廊渲染與燈箱預覽（含鍵盤與手機滑動手勢）
    // =========================================================================
    const galleryGrid = document.getElementById('galleryGrid')
    const lightbox = document.getElementById('lightbox')
    const lightboxImg = document.getElementById('lightboxImg')
    const lightboxCaption = document.getElementById('lightboxCaption')
    const lightboxCounter = document.getElementById('lightboxCounter')
    const lightboxClose = document.getElementById('lightboxClose')
    const lightboxPrev = document.getElementById('lightboxPrev')
    const lightboxNext = document.getElementById('lightboxNext')

    // 正規化照片資料，支援純字串路徑或 { src, caption } 物件
    const normalizedPhotos = galleryImages.map((item) => {
      if (typeof item === 'string') {
        const fileName = item.split('/').pop() || item
        const caption = fileName.replace(/\.[^/.]+$/, '')
        return { src: item, caption }
      }
      return {
        src: item.src,
        caption: item.caption || (item.src.split('/').pop() || '').replace(/\.[^/.]+$/, ''),
      }
    })

    let currentPhotoIndex = 0
    let touchStartX = 0
    let touchEndX = 0

    function renderGallery() {
      if (normalizedPhotos.length === 0) {
        galleryGrid.innerHTML = '<div class="gallery-empty">尚未設定照片，請於 JavaScript 的 <code>galleryImages</code> 陣列中加入照片路徑。</div>'
        return
      }

      galleryGrid.innerHTML = ''
      normalizedPhotos.forEach((photo, index) => {
        const card = document.createElement('div')
        card.className = 'gallery-item'
        card.setAttribute('role', 'listitem')
        card.setAttribute('tabindex', '0')
        card.setAttribute('aria-label', `檢視照片：${photo.caption}`)

        const img = document.createElement('img')
        img.src = photo.src
        img.alt = photo.caption
        img.loading = 'lazy'
        img.addEventListener('error', () => {
          card.innerHTML = `<div class="gallery-error">無法載入照片<br><small>${photo.src}</small></div>`
        })

        card.appendChild(img)

        const handleOpen = () => openLightbox(index)
        card.addEventListener('click', handleOpen)
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault()
            handleOpen()
          }
        })

        galleryGrid.appendChild(card)
      })
    }

    function updateLightboxView() {
      const photo = normalizedPhotos[currentPhotoIndex]
      if (!photo) return
      lightboxImg.src = photo.src
      lightboxImg.alt = photo.caption
      lightboxCaption.textContent = photo.caption
      lightboxCounter.textContent = `${currentPhotoIndex + 1} / ${normalizedPhotos.length}`
    }

    function openLightbox(index) {
      currentPhotoIndex = index
      updateLightboxView()
      lightbox.classList.add('open')
      lightbox.setAttribute('aria-hidden', 'false')
      document.body.style.overflow = 'hidden'
    }

    function closeLightbox() {
      lightbox.classList.remove('open')
      lightbox.setAttribute('aria-hidden', 'true')
      document.body.style.overflow = ''
    }

    function showPrevPhoto() {
      if (normalizedPhotos.length === 0) return
      currentPhotoIndex = (currentPhotoIndex - 1 + normalizedPhotos.length) % normalizedPhotos.length
      updateLightboxView()
    }

    function showNextPhoto() {
      if (normalizedPhotos.length === 0) return
      currentPhotoIndex = (currentPhotoIndex + 1) % normalizedPhotos.length
      updateLightboxView()
    }

    lightboxClose.addEventListener('click', closeLightbox)
    lightboxPrev.addEventListener('click', showPrevPhoto)
    lightboxNext.addEventListener('click', showNextPhoto)

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox()
    })

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return
      if (e.key === 'Escape') closeLightbox()
      if (e.key === 'ArrowLeft') showPrevPhoto()
      if (e.key === 'ArrowRight') showNextPhoto()
    })

    // 手機左右滑動手勢切換照片
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX
    }, { passive: true })

    lightbox.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX
      const deltaX = touchEndX - touchStartX
      if (Math.abs(deltaX) < 40) return
      if (deltaX > 0) {
        showPrevPhoto()
      } else {
        showNextPhoto()
      }
    }, { passive: true })

    // =========================================================================
    // 4. 精選作品集渲染與分類篩選
    // =========================================================================
    const filterBar = document.getElementById('filterBar')
    const portfolioGrid = document.getElementById('portfolioGrid')
    let activeCategory = '全部'

    function renderFilters() {
      const categories = ['全部', ...new Set(portfolioItems.map((item) => item.category))]
      filterBar.innerHTML = ''
      categories.forEach((cat) => {
        const btn = document.createElement('button')
        btn.type = 'button'
        btn.className = `filter-btn${cat === activeCategory ? ' active' : ''}`
        btn.textContent = cat
        btn.setAttribute('role', 'tab')
        btn.setAttribute('aria-selected', String(cat === activeCategory))
        btn.addEventListener('click', () => {
          activeCategory = cat
          renderFilters()
          renderPortfolio()
        })
        filterBar.appendChild(btn)
      })
    }

    function renderPortfolio() {
      const filtered = activeCategory === '全部'
        ? portfolioItems
        : portfolioItems.filter((item) => item.category === activeCategory)

      portfolioGrid.innerHTML = ''
      filtered.forEach((project) => {
        const card = document.createElement('article')
        card.className = 'project-card'

        const iconSvg = iconMap[project.icon] || iconMap.chart

        card.innerHTML = `
          <a class="project-card-cover" href="${project.url}" target="_blank" rel="noopener noreferrer" aria-label="${project.title}（在新分頁開啟）"></a>
          <div class="project-top">
            <div class="project-head-left">
              <div class="project-icon" aria-hidden="true">${iconSvg}</div>
              <h3 class="project-title">${project.title}</h3>
            </div>
            <div class="project-actions">
              <button class="project-shortcut-btn" type="button" aria-label="將「${project.title}」加到手機桌面" title="加到手機桌面">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="6" y="2" width="12" height="20" rx="2.5" />
                  <path d="M12 8v5" />
                  <path d="M9.5 10.5H14.5" />
                </svg>
              </button>
              <span class="project-arrow" aria-hidden="true">↗</span>
            </div>
          </div>
        `

        const shortcutBtn = card.querySelector('.project-shortcut-btn')
        shortcutBtn.addEventListener('click', (e) => {
          e.preventDefault()
          e.stopPropagation()
          openShortcutGuide(project.title, project.url, false)
        })

        portfolioGrid.appendChild(card)
      })
    }

    // =========================================================================
    // 5. 訪客計數器與留言板（串接 Google Apps Script + Google 試算表）
    // =========================================================================
    // 【重要設定】部署 gas/Code.gs 為網頁應用程式後，將產生的 URL 貼到下方引號內：
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyHs9OjJ9xWq92qXpXhTWwlvGhbi77CUK9EoCWVsPdKxpbwBpyZ8p4Sg4VeD1er_LGE/exec'

    const visitCountEl = document.getElementById('visitCount')
    const footerVisitCountEl = document.getElementById('footerVisitCount')
    const guestbookForm = document.getElementById('guestbookForm')
    const gbNameInput = document.getElementById('gbName')
    const gbMessageInput = document.getElementById('gbMessage')
    const gbSubmitBtn = document.getElementById('gbSubmitBtn')
    const gbStatusEl = document.getElementById('gbStatus')

    let cachedClientIp = '未知'

    async function fetchClientIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json')
        if (res.ok) {
          const data = await res.json()
          if (data && data.ip) cachedClientIp = data.ip
        }
      } catch (err) {
        cachedClientIp = '未知'
      }
      return cachedClientIp
    }

    function setVisitDisplay(val) {
      const text = val === null || val === undefined ? '--' : Number(val).toLocaleString()
      if (visitCountEl) visitCountEl.textContent = text
      if (footerVisitCountEl) footerVisitCountEl.textContent = text
    }

    async function recordVisit() {
      if (!GAS_ENDPOINT) {
        setVisitDisplay('待設定')
        return
      }
      try {
        const ip = await fetchClientIp()
        const ua = navigator.userAgent.slice(0, 120)
        const url = `${GAS_ENDPOINT}?action=visit&ip=${encodeURIComponent(ip)}&ua=${encodeURIComponent(ua)}`
        const res = await fetch(url)
        const data = await res.json()
        if (data && data.ok) {
          setVisitDisplay(data.count)
        }
      } catch (err) {
        setVisitDisplay('--')
      }
    }

    guestbookForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      const name = gbNameInput.value.trim()
      const message = gbMessageInput.value.trim()
      if (!name || !message) return

      if (!GAS_ENDPOINT) {
        gbStatusEl.className = 'guestbook-status err'
        gbStatusEl.textContent = '請先設定 index.html 中的 GAS_ENDPOINT 網址。'
        return
      }

      gbSubmitBtn.disabled = true
      gbStatusEl.className = 'guestbook-status'
      gbStatusEl.textContent = '傳送中...'

      try {
        const ip = cachedClientIp === '未知' ? await fetchClientIp() : cachedClientIp
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ name, message, ip }),
        })
        const data = await res.json()
        if (data && data.ok) {
          gbNameInput.value = ''
          gbMessageInput.value = ''
          gbStatusEl.className = 'guestbook-status ok'
          gbStatusEl.textContent = '留言已送出！感謝您的交流。'
          if (gbUnlocked && !guestbookPanelEl.classList.contains('hidden')) {
            await loadGuestbook()
          }
        } else {
          gbStatusEl.className = 'guestbook-status err'
          gbStatusEl.textContent = (data && data.error) || '送出失敗，請稍後再試。'
        }
      } catch (err) {
        gbStatusEl.className = 'guestbook-status err'
        gbStatusEl.textContent = '連線失敗，請檢查網路或 GAS 部署設定。'
      } finally {
        gbSubmitBtn.disabled = false
      }
    })

    // 查看留言密碼驗證與展開邏輯
    const gbViewBtn = document.getElementById('gbViewBtn')
    const guestbookPanelEl = document.getElementById('guestbookPanel')
    const guestbookListEl = document.getElementById('guestbookList')
    const gbPwdModal = document.getElementById('gbPwdModal')
    const gbPwdInput = document.getElementById('gbPwdInput')
    const gbPwdError = document.getElementById('gbPwdError')
    const gbPwdCancel = document.getElementById('gbPwdCancel')
    const gbPwdConfirm = document.getElementById('gbPwdConfirm')

    let gbUnlocked = false

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    function renderGuestbook(items) {
      if (!items || items.length === 0) {
        guestbookListEl.innerHTML = '<div class="guestbook-empty">目前尚無留言。</div>'
        return
      }
      guestbookListEl.innerHTML = items
        .map(
          (item) => `
          <div class="guestbook-item">
            <div class="guestbook-item-head">
              <span class="guestbook-author">${escapeHtml(item.name)}</span>
              <span class="guestbook-time">${escapeHtml(item.time)}</span>
            </div>
            <div class="guestbook-msg">${escapeHtml(item.message)}</div>
          </div>
        `
        )
        .join('')
    }

    async function loadGuestbook() {
      guestbookListEl.innerHTML = '<div class="guestbook-empty">載入留言中...</div>'
      try {
        const res = await fetch(`${GAS_ENDPOINT}?action=guestbook`)
        const data = await res.json()
        if (data && data.ok) {
          renderGuestbook(data.items)
        } else {
          guestbookListEl.innerHTML = '<div class="guestbook-empty">無法讀取留言，請稍後再試。</div>'
        }
      } catch (err) {
        guestbookListEl.innerHTML = '<div class="guestbook-empty">讀取留言失敗，請檢查連線。</div>'
      }
    }

    function openPwdModal() {
      gbPwdInput.value = ''
      gbPwdError.textContent = ''
      gbPwdModal.classList.remove('hidden')
      requestAnimationFrame(() => gbPwdInput.focus())
    }

    function closePwdModal() {
      gbPwdModal.classList.add('hidden')
    }

    async function submitPwd() {
      if (gbPwdInput.value.trim() === '0917') {
        gbUnlocked = true
        closePwdModal()
        guestbookPanelEl.classList.remove('hidden')
        gbViewBtn.textContent = '隱藏留言'
        await loadGuestbook()
        return
      }
      gbPwdError.textContent = '密碼錯誤，請重新輸入'
      gbPwdInput.focus()
      gbPwdInput.select()
    }

    gbViewBtn.addEventListener('click', () => {
      if (!gbUnlocked) {
        openPwdModal()
        return
      }
      const isHidden = guestbookPanelEl.classList.toggle('hidden')
      gbViewBtn.textContent = isHidden ? '查看留言' : '隱藏留言'
    })

    gbPwdCancel.addEventListener('click', closePwdModal)
    gbPwdConfirm.addEventListener('click', submitPwd)
    gbPwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault()
        submitPwd()
      } else if (e.key === 'Escape') {
        e.preventDefault()
        closePwdModal()
      }
    })
    gbPwdModal.addEventListener('click', (e) => {
      if (e.target === gbPwdModal) closePwdModal()
    })

    // =========================================================================
    // 5.5 加到手機桌面捷徑（PWA 一鍵安裝 + iOS/外部作品引導）
    // =========================================================================
    const installHomeBtn = document.getElementById('installHomeBtn')
    const shortcutModal = document.getElementById('shortcutModal')
    const shortcutTargetEl = document.getElementById('shortcutTarget')
    const shortcutStepsEl = document.getElementById('shortcutSteps')
    const shortcutCopyStatusEl = document.getElementById('shortcutCopyStatus')
    const shortcutCopyBtn = document.getElementById('shortcutCopyBtn')
    const shortcutOpenBtn = document.getElementById('shortcutOpenBtn')
    const shortcutCloseBtn = document.getElementById('shortcutCloseBtn')

    let deferredInstallPrompt = null
    let currentShortcutUrl = window.location.href

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault()
      deferredInstallPrompt = e
    })

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null
    })

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {})
      })
    }

    function getShortcutSteps(isHome) {
      const ua = navigator.userAgent || ''
      const isInApp = /Line\/|FBAN|FBAV|Instagram/i.test(ua)
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      const isAndroid = /Android/i.test(ua)

      if (isInApp) {
        return [
          '目前為 App 內建瀏覽器，請點右上或右下選單選擇 <strong>「以 Safari / Chrome 開啟」</strong>。',
          isHome
            ? '開啟後再點瀏覽器的 <strong>「加入主畫面」</strong> 即可建立桌面捷徑。'
            : '先點下方 <strong>「前往開啟」</strong> 進入該作品，再於瀏覽器選單點 <strong>「加入主畫面」</strong>。',
        ]
      }

      if (isIOS) {
        return isHome
          ? [
              '點擊 Safari 下方（或右上角）的 <strong>分享圖示（↑）</strong>。',
              '往下滑動選擇 <strong>「加入主畫面」</strong> → 右上角 <strong>「新增」</strong>。',
            ]
          : [
              '點擊下方 <strong>「前往開啟」</strong> 進入該作品頁面。',
              '在作品頁面點 Safari <strong>分享圖示（↑）</strong> → <strong>「加入主畫面」</strong>。',
            ]
      }

      if (isAndroid) {
        return isHome
          ? [
              '點擊 Chrome 右上角 <strong>⋮ 選單</strong>。',
              '選擇 <strong>「加到主畫面」</strong>（或「安裝應用程式」）即可。',
            ]
          : [
              '點擊下方 <strong>「前往開啟」</strong> 進入該作品頁面。',
              '在作品頁面點 Chrome 右上角 <strong>⋮ 選單</strong> → <strong>「加到主畫面」</strong>。',
            ]
      }

      return isHome
        ? [
            '在電腦版 Chrome / Edge 位址列右側點擊 <strong>「安裝」圖示</strong>，或於手機開啟本頁。',
            '手機 Chrome 可由選單 <strong>「加到主畫面」</strong>、iOS Safari 可由 <strong>「分享 → 加入主畫面」</strong> 建立捷徑。',
          ]
        : [
            '手機請先點下方 <strong>「前往開啟」</strong> 進入該作品頁面（瀏覽器安全限制需在該頁面操作）。',
            '開啟後於手機瀏覽器選單點 <strong>「加到主畫面」</strong> 即可建立該作品的桌面捷徑。',
          ]
    }

    function openShortcutGuide(title, url, isHome) {
      currentShortcutUrl = url
      shortcutTargetEl.textContent = title
      shortcutCopyStatusEl.textContent = ''
      shortcutStepsEl.innerHTML = getShortcutSteps(isHome).map((s) => `<li>${s}</li>`).join('')
      if (isHome) {
        shortcutOpenBtn.classList.add('hidden')
      } else {
        shortcutOpenBtn.href = url
        shortcutOpenBtn.classList.remove('hidden')
      }
      shortcutModal.classList.remove('hidden')
    }

    function closeShortcutModal() {
      shortcutModal.classList.add('hidden')
    }

    installHomeBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt()
        await deferredInstallPrompt.userChoice
        deferredInstallPrompt = null
        return
      }
      openShortcutGuide('Herman Hsiao（蕭正凌）個人首頁', window.location.href, true)
    })

    shortcutCopyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentShortcutUrl)
        shortcutCopyStatusEl.textContent = '已複製網址！'
      } catch (err) {
        shortcutCopyStatusEl.textContent = '複製失敗，請手動複製。'
      }
    })

    shortcutCloseBtn.addEventListener('click', closeShortcutModal)
    shortcutModal.addEventListener('click', (e) => {
      if (e.target === shortcutModal) closeShortcutModal()
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !shortcutModal.classList.contains('hidden')) {
        closeShortcutModal()
      }
    })

    // =========================================================================
    // 6. 初始化執行
    // =========================================================================
    document.getElementById('currentYear').textContent = new Date().getFullYear()
    renderGallery()
    renderFilters()
    renderPortfolio()
    recordVisit()
  </script>
</body>

</html>
